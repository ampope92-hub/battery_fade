name = "battery-fade"

# The verifier reads only these paths from the agent's final environment. Must stay
# top-level: nested under [verifier] the value is silently dropped.
artifacts = [
    "/app/predictor/src/",
    "/app/predictor/Cargo.toml",
    "/app/predictor/Cargo.lock",
    "/app/data/",
]

[metadata]
category = "ML"
subcategory = "Training"
tags = ["rust", "smartcore", "cargo", "regression", "extrapolation"]
languages = ["rust"]
difficulty = "core"
expert_time_estimate_hours = 10
author_name = "anonymous"
author_email = "anonymous"

difficulty_explanation = """
Every pack in the field export has more cycles than any pack in the teardown cohort —
50-600 in training, 850-1700 to be scored. Anything that partitions feature space cannot
leave the range it was fitted on, so gradient boosting, random forests and KNN all flatten
out at the training boundary and score negative R2 no matter how they are tuned; tuning
harder makes them worse, and in-range cross-validation never shows it. Recognizing that is
necessary but not sufficient. Capacity fade is diffusion-limited, falling with the square
root of cycles, so a straight linear fit picks up the average slope over 50-600 — much
steeper than the real slope out at 1200 — and keeps under-calling capacity on old packs,
landing at R2 -0.19. The stress drivers scale the fade rather than shifting it, so they
have to enter multiplied by the cycle term. Sqrt without those interactions reaches only
0.75. The work also happens in smartcore on an offline box with no Python data stack, so
scikit-learn habits do not transfer.

Calibrated across 6 generator seeds: the best available wrong answer is 0.8217 and the
weakest correct route is 0.9242, with the bar at 0.88 sitting between them. A second
bar of 0.87 applies to the highest-cycle quarter alone, where the same three routes score
0.9790, 0.9790 and 0.8873 against 0.7647 for the best wrong one. Three
independent routes clear it, so the task is not a single-path puzzle. Those numbers do not have to be
taken on trust: solution/generate_data.py regenerates the shipped CSVs (seed 0, verified
byte-identical by sha256) and solution/calibrate.py scores every route against the held-out
packs, so a reviewer can reproduce the separation directly. Both sit in solution/, which is
absent from the agent image, so shipping them cannot leak the labels.

The data is synthetic, generated from a diffusion-limited fade model with per-pack noise,
but the shape it reproduces is the one that makes this hard in practice: a teardown cohort
is small, expensive and biased towards packs pulled early, so it never spans the cycle
range of the fleet still running. Battery and reliability analytics engineers at
fleet-leasing operators and second-life battery firms do exactly this — size a replacement
schedule from a thin bench-tested cohort — and the extrapolation gap is the standing
hazard in that job, not an artefact of the generator.
"""

solution_explanation = """
The reference (solution/solve.sh) writes src/main.rs and runs the Cargo project. It
regresses capacity on sqrt(cycles) together with the stress drivers and, critically, those
drivers multiplied by sqrt(cycles) — chemistry, temperature, depth of discharge and
fast-charge share each scaling the fade rate — using smartcore's LinearRegression, and
clamps output to 0-100. It scores 0.9827 against the bench results with the bar at 0.88, and 0.9790 on the
highest-cycle quarter against that band's bar of 0.87.
"""

verification_explanation = """
The verifier runs in its own container. It collects the agent's crate sources
(/app/predictor/src, Cargo.toml, Cargo.lock) and the shipped export (/app/data) as
artifacts, drops them onto a prepared skeleton whose dependency tree is already compiled,
and runs cargo build/run --release --offline itself. The graded predictions.csv is
therefore always the output of a clean build of the agent's own code — a hand-written
predictions file never reaches the grader, and a crate that only compiles because of local
state does not survive.

Rebuilding the agent's crate means the verifier executes code the agent wrote, so that step
is the one thing it does not do as root. test.sh hands the crate to an unprivileged build
user and runs it through setpriv with supplementary groups cleared and no-new-privileges
set, so neither an inherited group nor a setuid binary can widen what that code reaches.
The graded answer key is baked into the image at /opt/golden, readable only by root. The
whole /tests mount — the verifier's own code as well as the plaintext label copy that
arrives there — is closed to the build user before anything untrusted starts, and if it is
still reachable the run is abandoned with reward 0 rather than graded: a reachable /tests is
one the agent can read the answers out of, or whose test file it can rewrite before pytest
reads it. The build runs in its own session, and its entire process group is torn down, then
every process the build user still owns is swept, before pytest runs and before the reward
is written — so nothing the agent started is alive during grading and no double-forked child
can rewrite the reward after it is computed. /logs is left to Harbor, which owns it; the
reward is simply written there last, once nothing hostile is running. Root alone runs pytest
and decides the reward from its exit status, and the shipped export is left read-only to the
build user. Verified by cheat arms — crates that read either copy of the labels, one that
overwrites test_outputs.py, one that writes reward.txt directly — each of which compiles and
then fails on permissions, scoring 0.

tests/test_outputs.py then runs seven checks: the shipped export is unaltered (sha256), the
schema is exactly pack_id,capacity_pct, coverage of the field packs is one-to-one, values
are numeric and within 0-100, predictions are a real spread rather than a constant, R2
against tests/golden/test_labels.csv reaches 0.88, and that same R2 recomputed over only the
highest-cycle quarter of the batch reaches 0.87. That first bar sits between the strongest
wrong approach and the weakest correct one, both established by sweeping each route across six
generator seeds: the best a wrong method achieves is 0.8217 (a tuned linear/boosted blend)
and the weakest passing route is 0.9242, with the threshold frozen against the tightest seed.

The high-cycle bar exists because an aggregate R2 is dominated by the field packs nearest the
training range, so a fade curve with the wrong exponent can drift badly at 1700 cycles and
still post a respectable overall number. The band is the 450 field packs with the most cycles
(1474-1700), fixed by sorting on (cycles, pack_id) so the split cannot shift between runs, and
membership is derived from the shipped export after re-checking its sha256 rather than from
anything the agent's crate can steer. On the shipped seed the same three routes clear both
bars - sqrt-with-interactions 0.9790, the high-cycle-half refit 0.9790, and the log-fade route
0.8873 - while the strongest wrong route reaches only 0.7647, so the second bar narrows the
gap without closing off any route the first one admits.
Only pytest is installed, so the CSV reading and the R2 come from the standard library.
"""

relevant_experience = """
I authored the fleet predictive-maintenance task that was accepted into the previous benchmark
edition, and this one is built on the harness and the calibration method I developed for it.
That method is the part I would point at: grant every wrong approach its best possible
adversary — tuned variants, blends, aggregate features — sweep them across several generated
seeds, and only then place the threshold between the strongest wrong answer and the weakest
correct one. Here that meant establishing that a half-and-half linear and boosted blend is the
best a wrong method can do at 0.8217, which is well above the naive routes and would have
quietly broken the task had I not swept for it. I also built the Rust/smartcore side of the
harness, including the parts of that library that behave differently from their Python
equivalents and have to be worked around by hand.
"""

[verifier]
# Nothing is fetched at grade time; every verifier dependency is baked into
# tests/Dockerfile, so the grading phase stays offline.
network_mode = "no-network"
timeout_sec = 1800
environment_mode = "separate"

[agent]
# Solved offline by design: the crates are pre-fetched and pinned in Cargo.lock, and
# network access would let the agent fetch a survival/ML library instead of
# implementing the fit, which is the work being measured.
network_mode = "no-network"
timeout_sec = 3600

[environment]
# Required "public" on every task, offline ones included: the image is built and the
# agent harness installed during this phase and that install needs the network. It says
# nothing about the agent or the verifier, both of which are closed below/above.
network_mode = "public"
build_timeout_sec = 900
cpus = 2
memory_mb = 6144
storage_mb = 10240
